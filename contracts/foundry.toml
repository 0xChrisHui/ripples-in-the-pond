[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

# CT-11：主网 verify-contract 复现一致性——把编译器设置从"forge 默认"钉死为显式值。
# - evm_version：forge 1.5 默认 "prague"(以太坊 Pectra)，OP 主网未必支持 → 钉 "cancun"
#   (OP Ecotone 起支持；本项目合约也不用任何 cancun 之后的新 opcode)。
# - optimizer：主网标准做法开优化省 gas（部署+调用），runs=200 平衡；关着是 forge 默认，非本意。
# - solc_version：钉当前在用的 0.8.33，保证 Etherscan/OP Explorer verify 用同一版复现字节码。
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
