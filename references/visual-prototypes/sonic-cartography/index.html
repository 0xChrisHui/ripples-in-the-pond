<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2efe7">
  <title>声音地形图谱 — Ripples in the Pond</title>
  <meta name="description" content="一张可聆听、演奏与收藏的声音地形图。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="masthead">
    <div class="identity">
      <p class="eyebrow">A LIVING ARCHIVE · 001—108</p>
      <h1><span>RIPPLES</span><span>IN THE POND</span></h1>
    </div>
    <nav class="chapters" aria-label="音乐章节">
      <span class="nav-label">CHAPTER</span>
      <button type="button" data-chapter="0" aria-pressed="true">01</button>
      <button type="button" data-chapter="1" aria-pressed="false">02</button>
      <button type="button" data-chapter="2" aria-pressed="false">03</button>
    </nav>
    <div class="top-actions">
      <button type="button" id="themeToggle" aria-label="切换明暗主题">反相</button>
      <button type="button" id="myMusic">我的音乐 <span id="collectionCount">00</span></button>
    </div>
  </header>

  <main class="atlas" aria-label="声音地形图谱">
    <section class="map-stage" id="mapStage" aria-label="36 个可播放的音乐坐标">
      <canvas id="terrain" aria-hidden="true"></canvas>
      <div class="axis axis-x"><span>00</span><span>18</span><span>36</span></div>
      <div class="axis axis-y"><span>+90</span><span>00</span><span>−90</span></div>
      <div id="nodes" class="node-layer" role="list"></div>
      <p class="depth-mark">DEPTH / 01</p>
    </section>

    <aside class="track-detail" aria-live="polite">
      <div class="detail-rule"><span id="detailState">等待信号</span><span id="detailDuration">00:00</span></div>
      <p id="detailNumber" class="detail-number">NO. 001</p>
      <h2 id="detailTitle">选择一个坐标</h2>
      <p id="detailMeta">将指针移向图谱，查看一首音乐的档案。</p>
      <div class="detail-actions">
        <button type="button" id="listenButton" disabled>LISTEN / 聆听</button>
        <button type="button" id="collectButton" disabled>ADD TO MY POND / 收藏</button>
      </div>
    </aside>
  </main>

  <section class="guide" id="guide" aria-label="使用提示">
    <span>选择一个坐标开始聆听</span>
    <span>按 A—Z 改变地形</span>
  </section>

  <footer class="transport" aria-live="polite">
    <span class="transport-status" id="transportStatus">ARCHIVE READY</span>
    <div class="transport-title"><span id="nowNumber">—</span><strong id="nowTitle">等待选择</strong></div>
    <div class="timeline" aria-label="播放进度"><i id="progress"></i></div>
    <span class="time" id="timeLabel">00:00 / 00:00</span>
    <button type="button" id="stopButton" disabled>STOP</button>
  </footer>

  <aside class="tuning" id="tuning" hidden aria-label="视觉参数">
    <div class="tuning-head"><strong>FIELD STUDY</strong><span>D 关闭</span></div>
    <label>等高线密度 <input data-tune="density" type="range" min="4" max="10" step="1" value="7"></label>
    <label>地形扭曲 <input data-tune="warp" type="range" min="0" max="1" step="0.05" value="0.38"></label>
    <label>波前速度 <input data-tune="speed" type="range" min="0.04" max="0.2" step="0.01" value="0.11"></label>
    <label>事件衰减 <input data-tune="decay" type="range" min="2" max="8" step="0.5" value="5"></label>
    <label>线条浓度 <input data-tune="ink" type="range" min="0.08" max="0.38" step="0.02" value="0.2"></label>
    <label>坐标尺度 <input data-tune="nodeScale" type="range" min="0.75" max="1.45" step="0.05" value="1"></label>
    <div class="presets" aria-label="视觉预设">
      <button type="button" data-preset="archive">ARCHIVE</button>
      <button type="button" data-preset="performance">PERFORMANCE</button>
      <button type="button" data-preset="afterimage">AFTERIMAGE</button>
    </div>
  </aside>

  <div class="key-signal" id="keySignal" aria-hidden="true">A</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
