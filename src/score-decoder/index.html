<!doctype html>
<html lang="en">
<head>

<meta name="color-scheme" content="dark"><title>Ripples in the Pond — Permanent Score</title>
<style>

.stage{width:min(1080px,100%);min-height:100vh;margin:auto;padding:28px clamp(20px,5vw,58px);display:grid;grid-template-rows:auto 1fr auto;gap:28px}.top,.score-head{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px}.mark{font:700 13px Arial;letter-spacing:-.08em}.folio,.score-head{color:var(--muted);font-size:9px;line-height:1.55;letter-spacing:.17em;text-transform:uppercase;text-align:right}

<body><div class="stage">
<header class="top"><div class="mark">R/P</div><div class="folio">Permanent score decoder<br>verified before playback</div></header>
<main class="main"><section class="intro"><div class="eyebrow">Immutable gestures · verifiable sound</div><h1>Ripples in<span>the Pond</span></h1><p class="copy">This score rebuilds its original performance from permanent, content-verified resources.</p></section>
<section class="player"><button id="play" class="disc" disabled aria-label="Play permanent score"></button><div class="transport"><div id="status" class="status">Verifying permanent resources…</div><div id="seek" class="rail" role="slider" tabindex="-1" aria-label="Playback position" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-disabled="true" data-disabled="true"><div id="bar"></div><span id="thumb" class="thumb" aria-hidden="true"></span></div></div></section></main>
<footer class="score"><div class="score-head"><span>Performance events</span><span id="meta"></span></div><div id="keys" class="keys"></div></footer>
</div><script>
"use strict";
const GATEWAYS=["https://arweave.net","https://ario.permagate.io"],TX=/^[A-Za-z0-9_-]{43}$/,SHA=/^[0-9a-f]{64}$/;
const KEYS=[..."abcdefghijklmnopqrstuvwxyz","space",..."345678"],ROLES=["events","base","soundSet","decoder"];
const LIMITS={events:131072,base:67108864,soundSet:262144,decoder:262144,package:65536,sound:4194304};
const enc=new TextEncoder(),dec=new TextDecoder("utf-8",{fatal:true});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const ar=id=>"ar://"+id;
function exact(value,keys,label){if(!value||typeof value!=="object"||Array.isArray(value))throw Error(label+" must be an object");const got=Object.keys(value).sort(),want=[...keys].sort();if(got.length!==want.length||got.some((key,i)=>key!==want[i]))throw Error(label+" fields are invalid")}
function ref(value,label){if(typeof value!=="string"||!value.startsWith("ar://")||!TX.test(value.slice(5)))throw Error(label+" must be ar://<txid>");return value}
function normMime(value){return String(value||"").trim().toLowerCase().replace(/\s*;\s*/g,"; ")}
function unicode(value){for(let i=0;i<value.length;i++){const code=value.charCodeAt(i);if(code>=55296&&code<=56319){if(i+1>=value.length)throw Error("invalid Unicode");const next=value.charCodeAt(++i);if(next<56320||next>57343)throw Error("invalid Unicode")}else if(code>=56320&&code<=57343)throw Error("invalid Unicode")}}
function canonical(value,seen=new WeakSet()){if(value===null)return"null";if(typeof value==="boolean")return value?"true":"false";if(typeof value==="string"){unicode(value);return JSON.stringify(value)}if(typeof value==="number"){if(!Number.isFinite(value))throw Error("non-finite JSON number");return JSON.stringify(value)}if(typeof value!=="object"||seen.has(value))throw Error("invalid JSON value");seen.add(value);let out;if(Array.isArray(value)){if(value.some((_,i)=>!(i in value)))throw Error("sparse JSON array");out="["+value.map(item=>canonical(item,seen)).join(",")+"]"}else{out="{"+Object.keys(value).sort().map(key=>{unicode(key);return JSON.stringify(key)+":"+canonical(value[key],seen)}).join(",")+"}"}seen.delete(value);return out}
async function sha(bytes){const hash=await crypto.subtle.digest("SHA-256",bytes);return[...new Uint8Array(hash)].map(byte=>byte.toString(16).padStart(2,"0")).join("")}
function same(left,right){if(left.byteLength!==right.byteLength)return false;for(let i=0;i<left.byteLength;i++)if(left[i]!==right[i])return false;return true}
async function verify(bytes,identity,mime){if(identity.bytes!==bytes.byteLength)throw Error("resource byte length mismatch");if(normMime(identity.mime)!==normMime(mime))throw Error("resource MIME mismatch");if(await sha(bytes)!==identity.sha256)throw Error("resource SHA-256 mismatch")}
function urls(value){const id=ref(value,"resource").slice(5);return GATEWAYS.map(gateway=>gateway+"/"+id)}
async function fetchBytes(value,options){let last;for(let round=0;round<2;round++){for(const url of urls(value)){try{const res=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!res.ok)throw Error("HTTP "+res.status);const mime=normMime(res.headers.get("content-type")),announced=Number(res.headers.get("content-length")||0);if(options.mime&&mime!==normMime(options.mime))throw Error("unexpected MIME "+mime);if(announced>options.max)throw Error("resource exceeds byte limit");const bytes=new Uint8Array(await res.arrayBuffer());if(bytes.byteLength>options.max)throw Error("resource exceeds byte limit");if(options.identity)await verify(bytes,options.identity,mime);return bytes}catch(error){last=error}}if(!round)await sleep(300)}throw last||Error("all permanent gateways failed")}
function json(bytes,label){try{return JSON.parse(dec.decode(bytes))}catch{throw Error(label+" is not valid UTF-8 JSON")}}
function parseParams(params){const names=[...params.keys()],allowed=new Set(["events","base","sounds","package","compat"]),legacy=["events","base","sounds"],hasLegacy=legacy.some(name=>params.has(name)),hasPackage=params.has("package"),hasCompat=params.has("compat");if(names.some(name=>!allowed.has(name)))throw Error("unsupported decoder parameter");for(const name of allowed)if(params.getAll(name).length>1)throw Error("duplicate "+name+" parameter");if(Number(hasLegacy)+Number(hasPackage)+Number(hasCompat)!==1)throw Error("package, compat and legacy parameters are mutually exclusive");if(hasPackage)return{kind:"package",packageRef:ref(params.get("package"),"package")};if(hasCompat)return{kind:"compat",compatRef:ref(params.get("compat"),"compat")};if(legacy.some(name=>!params.has(name)))throw Error("legacy decoder requires events, base and sounds");return{kind:"legacy",events:ref(params.get("events"),"events"),base:ref(params.get("base"),"base"),sounds:ref(params.get("sounds"),"sounds")}}
function resource(value,role){exact(value,["arTxId","sha256","bytes","mime"],role);const mimes={events:["application/json"],base:["audio/mpeg"],soundSet:["application/json"],decoder:["text/html","text/html; charset=utf-8"]};if(!TX.test(value.arTxId)||!SHA.test(value.sha256)||!Number.isSafeInteger(value.bytes)||value.bytes<1||value.bytes>LIMITS[role]||!mimes[role].includes(value.mime))throw Error(role+" identity is invalid");return value}
function parsePackage(bytes){if(bytes.byteLength>LIMITS.package)throw Error("score package exceeds 64KB");const value=json(bytes,"score package");exact(value,["schema","queueId","contentId","resources"],"score package");if(value.schema!=="ripples.score-package.v3"||!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value.queueId)||!/^[A-Za-z0-9][A-Za-z0-9:._-]{0,127}$/.test(value.contentId))throw Error("score package identity is invalid");exact(value.resources,ROLES,"resources");for(const role of ROLES)value.resources[role]=resource(value.resources[role],role);if(new Set(ROLES.map(role=>value.resources[role].arTxId)).size!==4)throw Error("resource tx ids must be unique");if(!same(bytes,enc.encode(canonical(value))))throw Error("score package is not RFC 8785 canonical JSON");return value}
function parseSoundSet(value){if(!value||value.schema!=="ripples.sound-set.v1"||value.publicationStatus!=="published"||JSON.stringify(value.keyOrder)!==JSON.stringify(KEYS)||!Array.isArray(value.entries)||value.entries.length!==33)throw Error("sound set header is invalid");const map=new Map();value.entries.forEach((entry,index)=>{if(entry.key!==KEYS[index]||!TX.test(entry.arTxId||"")||!SHA.test(entry.sha256||"")||!Number.isSafeInteger(entry.bytes)||entry.bytes<1||entry.bytes>LIMITS.sound||entry.mime!=="audio/mpeg"||!(entry.durationMs>0))throw Error("sound identity is invalid: "+KEYS[index]);if(entry.blobKey!=null&&entry.blobKey!=="media/"+entry.arTxId)throw Error("sound blob identity is invalid: "+entry.key);map.set(entry.key,entry)});return map}
async function parseCompat(bytes){const value=json(bytes,"compatibility manifest"),required=["schema","chainId","scoreContract","tokenId","originalTokenURI","original","effectiveSounds","publishedAt","canonicalDigest","signature"];if(!value||typeof value!=="object"||required.some(key=>!(key in value))||value.schema!=="ripples.score-compatibility.v1"||!Number.isSafeInteger(value.chainId)||value.chainId<1||!/^0x[0-9a-fA-F]{40}$/.test(value.scoreContract)||!Number.isSafeInteger(value.tokenId)||value.tokenId<1||typeof value.publishedAt!=="string"||!/Z$/.test(value.publishedAt)||Number.isNaN(Date.parse(value.publishedAt))||!SHA.test(value.canonicalDigest))throw Error("compatibility manifest identity is invalid");ref(value.originalTokenURI,"originalTokenURI");exact(value.original,["events","base","sounds"],"original refs");for(const name of ["events","base","sounds"])ref(value.original[name],"original "+name);if(!value.effectiveSounds||typeof value.effectiveSounds!=="object"||Array.isArray(value.effectiveSounds))throw Error("effectiveSounds is invalid");const sounds=new Map();for(const [key,item]of Object.entries(value.effectiveSounds)){exact(item,["arTxId","sha256","bytes","mime"],"effective sound "+key);if(!KEYS.includes(key)||!TX.test(item.arTxId||"")||!SHA.test(item.sha256||"")||!Number.isSafeInteger(item.bytes)||item.bytes<1||item.bytes>LIMITS.sound||item.mime!=="audio/mpeg")throw Error("effective sound identity is invalid: "+key);sounds.set(key,{key,...item})}const signature=typeof value.signature==="string"?value.signature:value.signature&&(value.signature.value||value.signature.signature);if(!/^0x[0-9a-fA-F]{130}$/.test(signature||""))throw Error("compatibility signature is invalid");if(value.signature&&typeof value.signature==="object"&&value.signature.signer!==undefined&&!/^0x[0-9a-fA-F]{40}$/.test(value.signature.signer))throw Error("compatibility signer is invalid");const{canonicalDigest,signature:ignored,...payload}=value;if(await sha(enc.encode(canonical(payload)))!==canonicalDigest)throw Error("compatibility canonical digest mismatch");return{original:value.original,sounds}}
function parseLegacySounds(value){const table=value&&value.version&&value.sounds?value.sounds:value;if(!table||typeof table!=="object"||Array.isArray(table))throw Error("legacy sounds map is invalid");const map=new Map();for(const [key,item]of Object.entries(table)){const id=typeof item==="string"?item:item&&item.txId;if(!/^(?:[a-z]|space|[3-8])$/.test(key)||!TX.test(id||"")||map.has(key))throw Error("legacy sound identity is invalid: "+key);map.set(key,{key,arTxId:id,mime:"audio/mpeg"})}return map}
function parseEvents(value,sounds){if(!Array.isArray(value)||value.length>500)throw Error("events must be an array of at most 500 items");return value.map((event,index)=>{exact(event,["key","time","duration"],"event "+index);if(typeof event.key!=="string"||!sounds.has(event.key)||!Number.isFinite(event.time)||event.time<0||event.time>60000||!Number.isFinite(event.duration)||event.duration<0||event.duration>5000)throw Error("event is invalid or missing from sound set: "+index);return event}).sort((a,b)=>a.time-b.time)}
async function pool(items,limit,worker){let cursor=0;await Promise.all(Array.from({length:Math.min(limit,items.length)},async()=>{while(cursor<items.length){const item=items[cursor++];await worker(item)}}))}
let ctx,baseBuffer,events=[],soundBuffers=new Map(),sources=[],startedAt=0,total=0,position=0,raf=0,ready=false,seeking=false,seekPreview=0;
const byId=id=>document.getElementById(id);
function status(message,error=false){byId("status").textContent=message;byId("status").className=error?"status err":"status"}
function emit(type,payload={}){if(window.parent!==window)window.parent.postMessage({source:"ripples-decoder",v:1,type,...payload},"*")}
function emitState(playing,positionMs){emit("state",{playing,positionMs:Math.max(0,Math.round(positionMs)),durationMs:Math.round(total)})}
function render(positionMs){const shown=Math.min(total,Math.max(0,positionMs)),ratio=total?shown/total:0,seek=byId("seek");byId("bar").style.width=ratio*100+"%";byId("thumb").style.left=ratio*100+"%";seek.setAttribute("aria-valuemax",String(Math.round(total)));seek.setAttribute("aria-valuenow",String(Math.round(shown)));seek.setAttribute("aria-valuetext",Math.round(shown/1000)+"s / "+Math.round(total/1000)+"s")}
function drawKeys(keys){byId("keys").replaceChildren(...keys.map(key=>{const node=document.createElement("div");node.className="key";node.id="key-"+key;node.textContent=key;return node}))}
function flash(key){const node=byId("key-"+key);if(node){node.classList.add("on");setTimeout(()=>node.classList.remove("on"),180)}}
async function inputs(reference){if(reference.kind==="legacy"){const [eventBytes,baseBytes,soundBytes]=await Promise.all([fetchBytes(reference.events,{mime:"application/json",max:LIMITS.events}),fetchBytes(reference.base,{mime:"audio/mpeg",max:LIMITS.base}),fetchBytes(reference.sounds,{mime:"application/json",max:LIMITS.soundSet})]);const sounds=parseLegacySounds(json(soundBytes,"legacy sounds"));return{eventBytes,baseBytes,sounds,mode:"legacy compatible"}}if(reference.kind==="compat"){const manifestBytes=await fetchBytes(reference.compatRef,{mime:"application/json",max:LIMITS.soundSet}),compat=await parseCompat(manifestBytes);const [eventBytes,baseBytes]=await Promise.all([fetchBytes(compat.original.events,{mime:"application/json",max:LIMITS.events}),fetchBytes(compat.original.base,{mime:"audio/mpeg",max:LIMITS.base}),fetchBytes(compat.original.sounds,{mime:"application/json",max:LIMITS.soundSet})]);return{eventBytes,baseBytes,sounds:compat.sounds,mode:"compat verified"}}
const packageBytes=await fetchBytes(reference.packageRef,{mime:"application/json",max:LIMITS.package}),pack=parsePackage(packageBytes),r=pack.resources;status("Verifying the permanent dependency closure…");const [eventBytes,baseBytes,soundBytes]=await Promise.all([fetchBytes(ar(r.events.arTxId),{identity:r.events,mime:r.events.mime,max:LIMITS.events}),fetchBytes(ar(r.base.arTxId),{identity:r.base,mime:r.base.mime,max:LIMITS.base}),fetchBytes(ar(r.soundSet.arTxId),{identity:r.soundSet,mime:r.soundSet.mime,max:LIMITS.soundSet}),fetchBytes(ar(r.decoder.arTxId),{identity:r.decoder,mime:r.decoder.mime,max:LIMITS.decoder})]);return{eventBytes,baseBytes,sounds:parseSoundSet(json(soundBytes,"sound set")),mode:"v3 verified"}}
async function load(){const reference=parseParams(new URL(location.href).searchParams);ctx=new(window.AudioContext||window.webkitAudioContext)();const loaded=await inputs(reference);events=parseEvents(json(loaded.eventBytes,"events"),loaded.sounds);drawKeys([...loaded.sounds.keys()]);status("Decoding the base recording…");baseBuffer=await ctx.decodeAudioData(loaded.baseBytes.buffer.slice(0));const used=[...new Set(events.map(event=>event.key))];await pool(used,6,async key=>{status("Verifying sound "+key+"…");const item=loaded.sounds.get(key),bytes=await fetchBytes(ar(item.arTxId),item.sha256?{identity:item,mime:"audio/mpeg",max:LIMITS.sound}:{mime:"audio/mpeg",max:LIMITS.sound});soundBuffers.set(key,await ctx.decodeAudioData(bytes.buffer.slice(0)))});total=Math.max(baseBuffer.duration*1000,...events.map(event=>event.time+event.duration));byId("meta").textContent=events.length+" events · "+used.length+" sounds · "+loaded.mode;status("Ready · "+Math.ceil(total/1000)+" seconds");byId("play").disabled=false;const seek=byId("seek");seek.tabIndex=0;seek.dataset.disabled="false";seek.setAttribute("aria-disabled","false");render(0);ready=true;emit("ready",{durationMs:Math.round(total)})}
function stop(reset=true){if(raf)cancelAnimationFrame(raf);raf=0;sources.forEach(source=>{try{source.stop()}catch{}});sources=[];byId("play").classList.remove("playing");if(reset)render(0)}
async function play(from=position){await ctx.resume();stop(false);if(from>=total)from=0;position=from;const at=ctx.currentTime+.08;startedAt=at;if(from<baseBuffer.duration*1000){const base=ctx.createBufferSource();base.buffer=baseBuffer;base.connect(ctx.destination);base.start(at,from/1000);sources.push(base)}events.forEach(event=>{const buffer=soundBuffers.get(event.key),tailOffset=Math.max(0,(from-event.time)/1000);if(tailOffset>=buffer.duration)return;const source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);source.start(at+Math.max(0,event.time-from)/1000,tailOffset);sources.push(source)});byId("play").classList.add("playing");status("Playing verified score…");emitState(true,from);let index=events.findIndex(event=>event.time>=from);if(index<0)index=events.length;const tick=()=>{const elapsed=Math.min(total,Math.max(position,position+(ctx.currentTime-startedAt)*1000));if(!seeking)render(elapsed);while(events[index]&&events[index].time<=elapsed)flash(events[index++].key);if(elapsed<total)raf=requestAnimationFrame(tick);else{position=total;render(total);stop(false);status("Complete · play again");emitState(false,total);emit("ended")}};raf=requestAnimationFrame(tick)}
function toggle(){if(sources.length){const paused=Math.min(total,position+Math.max(0,(ctx.currentTime-startedAt)*1000));stop(false);position=paused;render(paused);status("Paused · ready to resume");emitState(false,paused)}else play().catch(fail)}
function seekTo(positionMs){const target=Math.min(total,Math.max(0,positionMs)),wasPlaying=sources.length>0;stop(false);position=target;render(target);if(wasPlaying&&target<total)play(target).catch(fail);else{status(target>=total?"Complete · play again":"Ready at selected position · click ▶ to play");emitState(false,target)}}
function pointerPosition(event){const rect=byId("seek").getBoundingClientRect(),ratio=rect.width?Math.min(1,Math.max(0,(event.clientX-rect.left)/rect.width)):0;return ratio*total}
function previewSeek(positionMs){seekPreview=positionMs;render(positionMs)}
function seekKey(event){const seek=byId("seek");if(seek.dataset.disabled==="true")return;const current=Number(seek.getAttribute("aria-valuenow"))||0,step=Math.max(1000,total/100)*(event.shiftKey?10:1),next=event.key==="Home"?0:event.key==="End"?total:["ArrowRight","ArrowUp","PageUp"].includes(event.key)?current+step:["ArrowLeft","ArrowDown","PageDown"].includes(event.key)?current-step:null;if(next===null)return;event.preventDefault();seekTo(next)}
function fail(error){console.error(error);const message=error instanceof Error?error.message:String(error);status("Unavailable · "+message,true);emit("error",{message})}
function install(){byId("play").addEventListener("click",toggle);const seek=byId("seek");seek.addEventListener("pointerdown",event=>{if(seek.dataset.disabled==="true"||(event.pointerType==="mouse"&&event.button!==0))return;event.preventDefault();seek.focus({preventScroll:true});seek.setPointerCapture(event.pointerId);seeking=true;seek.dataset.dragging="true";previewSeek(pointerPosition(event))});seek.addEventListener("pointermove",event=>{if(seeking&&seek.hasPointerCapture(event.pointerId))previewSeek(pointerPosition(event))});seek.addEventListener("pointerup",event=>{if(!seeking)return;previewSeek(pointerPosition(event));seeking=false;seek.dataset.dragging="false";seek.releasePointerCapture(event.pointerId);seekTo(seekPreview)});seek.addEventListener("pointercancel",()=>{seeking=false;seek.dataset.dragging="false";render(position)});seek.addEventListener("lostpointercapture",()=>{if(seeking){seeking=false;seek.dataset.dragging="false";seekTo(seekPreview)}});seek.addEventListener("keydown",seekKey);addEventListener("message",event=>{const data=event.data;if(!ready||!data||data.source!=="ripples-parent")return;if(data.type==="play"&&!sources.length)play().catch(fail);else if(data.type==="pause"&&sources.length)toggle();else if(data.type==="toggle")toggle()});load().catch(fail)}
if(!globalThis.__RIPPLES_DECODER_TEST__)install();
</script></body></html>
