# 所有回源共享 TLS 验证与头清洗；map 仅在 API 请求上发出本机可信值。
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host pond-ripple.xyz;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header x-pond-client-ip $pond_client_ip;
proxy_set_header x-pond-edge-secret $pond_edge_key;
proxy_hide_header X-Cache-Status;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate __CA_BUNDLE__;
proxy_ssl_server_name on;
proxy_ssl_name pond-ripple.xyz;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
